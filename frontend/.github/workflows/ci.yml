name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pipeline conforme à rules/cicd.md : Lint → Format → Tests → Build.
# NEXT_PUBLIC_API_URL est une valeur factice ici : le build Next.js a besoin qu'elle existe
# pour s'exécuter sans .env.local.
jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
